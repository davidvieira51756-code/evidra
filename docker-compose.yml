services:
  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"

  core-api:
    build:
      context: ./apps/core-api
    environment:
      EVIDRA_AI_SERVICE_BASE_URL: http://ai-service:8000
      EVIDRA_AI_SERVICE_TIMEOUT_SECONDS: 45
    depends_on:
      - ai-service
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./apps/ai-service
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    ports:
      - "8000:8000"
